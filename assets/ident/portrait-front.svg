<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" fill="none" role="img" aria-label="Line-art portrait">
  <defs><style>
    .l{stroke:#f4f4f6;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
